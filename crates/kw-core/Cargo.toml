[package]
name = "kw-core"
version = "0.2.1"
edition = "2021"
description = "Kwalendar core: local store, Google Calendar sync, recurrence, reminders"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
futures = "0.3"
keyring = { version = "3", features = ["windows-native"] }
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
rrule = "0.13"
semver = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
